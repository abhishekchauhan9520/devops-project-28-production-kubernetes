apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: production-app
  namespace: production-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.example.com"]
      secretName: production-app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: production-app
                port:
                  number: 80
