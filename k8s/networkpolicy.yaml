apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: production-app
  namespace: production-demo
spec:
  podSelector:
    matchLabels:
      app: production-app
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
